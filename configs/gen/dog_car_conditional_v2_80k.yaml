hsdp_dim: 1

logging:
  project: "dog-car-conditional-v2-80k"
  entity: ""
  use_wandb: false
  log_every_k: 100
  console_preview_keys:
    - g_norm
    - loss
    - loss_drift
    - loss_pair
    - loss_condition
    - loss_tv
    - gen_pair_distance
    - semantic_loss
    - gen_abs_max
    - gen_is_finite
    - gen_nonfinite
    - loss_0.2/norm_x
    - val/loss
    - val/loss_drift
    - val/loss_condition
    - val/loss_tv
    - val/gen_pair_distance
    - val/semantic_loss
    - val/loss_0.2/norm_x
    - lr

dataset:
  mode: conditional_imagefolder
  # Contains train/, val/, and test/, each with cars/ and dogs/ subfolders.
  data_path: "~/DogCar_split"
  # One global min/max is measured across train, val, and test and cached as
  # .conditional_image_minmax.json. Images are min-max normalized to [0,1],
  # resized to this square size, and training images are then augmented.
  resolution: 64
  use_aug: true
  use_hflip: true
  use_latent: false
  use_cache: false
  # Alphabetical ImageFolder mapping: cars=0, dogs=1.
  num_classes: 2
  use_class_labels: true
  batch_size: 8
  eval_batch_size: 8
  # One RGB source enables explicit source-feature supervision.
  k_conditions: 1
  condition_channels: 3
  # Expose each target through several independently sampled condition sets.
  condition_sets_per_target: 4
  # For every clean entry, add two on-the-fly augmented entries during training.
  # Validation and test continue to use only clean images.
  augmented_copies_per_image: 2
  # Independent same-class examples defining the positive distribution.
  k_positive: 4
  k_neg: 4
  seed: 42
  kwargs:
    num_workers: 0
    pin_memory: false
    prefetch_factor: 2

model:
  cond_dim: 256
  input_size: 64
  # 3 noise channels followed by one complete RGB condition image.
  in_channels: 6
  noise_in_channels: 3
  source_in_channels: 3
  pixel_range: "zero_one"
  # Bound model outputs to the same [0,1] range as preprocessed real images.
  output_activation: "sigmoid"
  out_channels: 3
  # Natural images have no anatomical coordinate conditioning.
  use_coord_cond: false
  coord_dim: 3
  patch_size: 4
  hidden_size: 256
  depth: 4
  num_heads: 4
  mlp_ratio: 4.0
  use_qknorm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  n_cls_tokens: 4
  noise_classes: 16
  noise_coords: 16
  use_bf16: true
  attn_fp32: true
  use_remat: false

optimizer:
  lr_schedule:
    learning_rate: 0.00001
    warmup_steps: 200
    lr_schedule: "const"
    total_steps: 80000
  weight_decay: 0.01
  adam_b1: 0.9
  adam_b2: 0.95

train:
  conditional: true
  train_batch_size: 8
  seed: 42
  total_steps: 80000
  save_per_step: 5000
  # Keep every 10k checkpoint long-term; also retain the two latest 5k saves.
  keep_every: 10000
  keep_last: 2
  enable_eval: false
  sanity_eval_at_step1: false
  enable_val_loss: true
  val_loss_per_step: 1000
  val_loss_batches: 4
  log_gen_diagnostics: true
  log_update_diagnostics: false
  max_grad_norm: 0.5
  lambda_drift: 1.0
  # The objective is category-level matching rather than exact target reconstruction.
  lambda_pair: 0.0
  # Differentiable InfoNCE source-condition objective; unlike the monitor, this
  # term actually updates the generator and prevents class-only shortcuts.
  lambda_condition: 0.1
  condition_temperature: 0.1
  # Penalize checkerboard/high-frequency texture without forcing pixel averages.
  lambda_tv: 0.02
  forward_dict:
    # Multiple noises for every source expose within-condition mode collapse.
    gen_per_label: 4
  activation_kwargs:
    patch_mean_size: [2]
    patch_std_size: [2]
    use_std: true
    use_mean: true
    every_k_block: 2
  loss_kwargs:
    R_list: [0.2]
  ema_decay: 0.999
  init_from: ""

feature:
  # Do not optimize raw pixel distances for unaligned photographs. Doing so
  # encourages the generator to reproduce coarse averages of the conditions.
  # Use the pretrained MAE representation as the drift space instead.
  mae_path: "hf://mae_pixel_640"
  use_convnext: false
  use_mae: true
  include_raw_global: false
  input_range: "zero_one"
