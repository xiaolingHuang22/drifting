hsdp_dim: 1

logging:
  project: "drifting-imagenet-subset"
  entity: "YOUR_WANDB_ENTITY"
  use_wandb: false
  log_every_k: 20

dataset:
  resolution: 256
  use_aug: true
  use_latent: false
  use_cache: false
  num_classes: 10
  batch_size: 8
  eval_batch_size: 8
  kwargs:
    num_workers: 4
    pin_memory: true
    prefetch_factor: 2

model:
  cond_dim: 256
  input_size: 256
  in_channels: 3
  patch_size: 16
  hidden_size: 256
  depth: 4
  num_heads: 4
  mlp_ratio: 4.0
  out_channels: 3
  use_qknorm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  n_cls_tokens: 8
  noise_classes: 16
  noise_coords: 16
  use_bf16: true
  attn_fp32: true
  use_remat: false

optimizer:
  lr_schedule:
    learning_rate: 0.0001
    warmup_steps: 100
    lr_schedule: "const"
    total_steps: 2500
  weight_decay: 0.01
  adam_b1: 0.9
  adam_b2: 0.95

train:
  train_batch_size: 8
  seed: 42
  total_steps: 2500
  save_per_step: 200
  keep_every: 1000
  eval_per_step: 1000000
  pos_per_sample: 8
  neg_per_sample: 4
  positive_bank_size: 32
  negative_bank_size: 128
  forward_dict:
    gen_per_label: 4
    cfg_min: 1.0
    cfg_max: 2.0
    neg_cfg_pw: 2.0
  activation_kwargs:
    patch_mean_size: [2]
    patch_std_size: [2]
    use_std: true
    use_mean: true
    every_k_block: 2
  loss_kwargs:
    R_list: [0.2, 0.05]
  cfg_list: [1.0]
  ema_decay: 0.999
  push_per_step: 8

feature:
  mae_path: "hf://mae_pixel_640"
  use_convnext: false
  use_mae: true
